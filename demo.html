<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body{
            background-color:#f2f2f2;
            font-family:Arial;
        }

        .login-box{
            width:350px;
            margin:100px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h2{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:15px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            background:blue;
            color:white;
            border:none;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:darkblue;
        }
    </style>

</head>

<body>

<div class="login-box">

<h2>Login Form</h2>

<form>

<label>Email</label>
<input type="email" id="email" name="email" placeholder="Enter Email">

<label>Password</label>
<input type="password" id="pass" name="pass" placeholder="Enter Password">

<button type="submit" id="login" name="login">Login</button>

</form>

</div>

</body>
</html>
